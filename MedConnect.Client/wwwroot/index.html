<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedConnect GH</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="MedConnect.Client.styles.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('medconnect_theme');
                if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) { }
        })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" style="display: none;">An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">Dismiss</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/chat.js"></script>
    <script>
        // Offline PWA: register the service worker for later loads. Errors are
        // ignored so a rejected registration never blocks the app.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(function () { });
        }
    </script>
</body>

</html>
